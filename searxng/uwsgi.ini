# uWSGI Yapılandırması
[uwsgi]

# Uygulama
module = searx.webapp
callable = app

# Master process
master = true

# Worker sayısı (CPU core sayısına göre ayarla)
workers = 4

# Thread sayısı
threads = 4

# Buffer boyutu
buffer-size = 8192

# Socket
http-socket = 0.0.0.0:8080

# Timeout
http-timeout = 30
socket-timeout = 30

# Graceful reload
die-on-term = true
lazy-apps = true

# Logging
disable-logging = false
log-4xx = true
log-5xx = true

# Stats
stats = 127.0.0.1:9191
stats-http = true

# Memory
reload-on-rss = 512
