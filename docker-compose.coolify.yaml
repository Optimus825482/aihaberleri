version: "3.8"

networks:
  # SearXNG network - allows worker to access self-hosted SearXNG
  searxng-network:
    external: true
    name: pwcsc8ow08oks0ggokwoo8ww

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: aihaberleri-postgres
    hostname: aihaberleri-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 518518Erkan
      POSTGRES_DB: postgresainewsdb
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgresainewsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis (Local container)
  redis:
    image: redis:7-alpine
    container_name: aihaberleri-redis
    hostname: aihaberleri-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # BullMQ Worker (Agent Automation)
  worker:
    container_name: aihaberleri-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
      args:
        BUILDKIT_INLINE_CACHE: 1
        DOCKER_BUILDKIT: 1
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    environment:
      DATABASE_URL: postgres://postgres:518518Erkan@aihaberleri-postgres:5432/postgresainewsdb?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
      REDIS_URL: redis://aihaberleri-redis:6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://10.0.4.4:8080}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-info@aihaberleri.org}
      NEXT_PUBLIC_SITE_URL: https://aihaberleri.org
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_EMAIL:-mailto:admin@aihaberleri.org}
      # Cloudflare R2 Storage
      R2_ENDPOINT: https://aeccc306d39052bd2f83982530dd11a5.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: 28a9b95872b15484627a7713c1b57998
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: aihaberleri-images
      # Use custom domain instead of r2.dev (fixes SSL issues)
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://images.aihaberleri.org}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_MIN_ARTICLES_PER_RUN: ${AGENT_MIN_ARTICLES_PER_RUN:-1}
      AGENT_MAX_ARTICLES_PER_RUN: ${AGENT_MAX_ARTICLES_PER_RUN:-1}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - default
      - searxng-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "news-agent.worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Next.js App
  app:
    container_name: aihaberleri-app
    hostname: aihaberleri-app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        BUILDKIT_INLINE_CACHE: 1
        DOCKER_BUILDKIT: 1
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 1G
    environment:
      DATABASE_URL: postgres://postgres:518518Erkan@aihaberleri-postgres:5432/postgresainewsdb?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
      REDIS_URL: redis://aihaberleri-redis:6379
      NEXTAUTH_URL: https://aihaberleri.org
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://10.0.4.4:8080}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-info@aihaberleri.org}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      NEXT_PUBLIC_SITE_URL: https://aihaberleri.org
      NEXT_PUBLIC_SITE_NAME: "AI Haberleri"
      NEXT_PUBLIC_SITE_DESCRIPTION: "Yapay zeka dunyasindaki gelismeleri yakindan takip edin"
      TWITTER_HANDLE: "@aihaberleriorg"
      CONTACT_EMAIL: "info@aihaberleri.org"
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_MIN_ARTICLES_PER_RUN: ${AGENT_MIN_ARTICLES_PER_RUN:-1}
      AGENT_MAX_ARTICLES_PER_RUN: ${AGENT_MAX_ARTICLES_PER_RUN:-1}
      AGENT_MIN_INTERVAL_HOURS: ${AGENT_MIN_INTERVAL_HOURS:-6}
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - default
      - searxng-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local