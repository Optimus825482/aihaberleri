version: "3.8"

networks:
  # SearXNG network - allows worker to access self-hosted SearXNG
  searxng-network:
    external: true
    name: pwcsc8ow08oks0ggokwoo8ww

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: aihaberleri-postgres
    hostname: aihaberleri-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 518518Erkan
      POSTGRES_DB: postgresainewsdb
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgresainewsdb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # PostgreSQL Daily Backup (retention: 2 files)
  postgres-backup:
    image: postgres:17-alpine
    container_name: aihaberleri-postgres-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-518518Erkan}
      DB_HOST: ${POSTGRES_HOST:-aihaberleri-postgres}
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-postgresainewsdb}
      DB_USER: ${POSTGRES_USER:-postgres}
      BACKUP_DIR: /backups
      RETENTION_COUNT: 2
    volumes:
      - ./scripts/postgres-backup.sh:/scripts/postgres-backup.sh:ro
      - ./backups/postgres:/backups
    command: >
      sh -c "echo '0 3 * * * sh /scripts/postgres-backup.sh >> /var/log/postgres-backup.log 2>&1' > /etc/crontabs/root &&
      crond -f -l 8"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Redis (Local container)
  redis:
    image: redis:7-alpine
    container_name: aihaberleri-redis
    hostname: aihaberleri-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # BullMQ Worker (Agent Automation)
  worker:
    container_name: aihaberleri-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
      args:
        BUILDKIT_INLINE_CACHE: 1
        DOCKER_BUILDKIT: 1
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
        reservations:
          memory: 512M
    environment:
      DATABASE_URL: postgres://postgres:518518Erkan@aihaberleri-postgres:5432/postgresainewsdb?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
      REDIS_URL: redis://aihaberleri-redis:6379
      # AI Models
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_URL: ${NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-qwen/qwen3-next-80b-a3b-instruct}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      # Search & Scraping
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng-pwcsc8ow08oks0ggokwoo8ww.77.42.68.4.sslip.io}
      JINA_READER_API_KEY: ${JINA_READER_API_KEY}
      # Image Sources
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-info@aihaberleri.org}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@aihaberleri.org}
      # Push Notifications
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      NEXT_PUBLIC_SITE_URL: https://aihaberleri.org
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_EMAIL:-mailto:admin@aihaberleri.org}
      # Cloudflare R2 Storage
      R2_ENDPOINT: https://aeccc306d39052bd2f83982530dd11a5.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: 28a9b95872b15484627a7713c1b57998
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: aihaberleri-images
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://images.aihaberleri.org}
      # Cloudflare CDN Cache Purge
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Social Media - Twitter
      TWITTER_ENABLED: ${TWITTER_ENABLED:-false}
      TWITTER_API_KEY: ${TWITTER_API_KEY}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET}
      TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN}
      TWITTER_ACCESS_SECRET: ${TWITTER_ACCESS_SECRET}
      # Social Media - Facebook
      FACEBOOK_ENABLED: ${FACEBOOK_ENABLED:-true}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN}
      FACEBOOK_EN_ENABLED: ${FACEBOOK_EN_ENABLED:-true}
      FACEBOOK_EN_PAGE_ID: ${FACEBOOK_EN_PAGE_ID}
      FACEBOOK_EN_PAGE_ACCESS_TOKEN: ${FACEBOOK_EN_PAGE_ACCESS_TOKEN}
      # Social Media - Bluesky
      BLUESKY_ENABLED: ${BLUESKY_ENABLED:-true}
      BLUESKY_HANDLE: ${BLUESKY_HANDLE}
      BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD}
      # Social Media - Mastodon
      MASTODON_ENABLED: ${MASTODON_ENABLED:-true}
      MASTODON_INSTANCE_URL: ${MASTODON_INSTANCE_URL:-https://mastodon.social}
      MASTODON_ACCESS_TOKEN: ${MASTODON_ACCESS_TOKEN}
      # Agent Config
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_MIN_ARTICLES_PER_RUN: ${AGENT_MIN_ARTICLES_PER_RUN:-1}
      AGENT_MAX_ARTICLES_PER_RUN: ${AGENT_MAX_ARTICLES_PER_RUN:-1}
      AGENT_SKIP_EMPTY_DELAY: ${AGENT_SKIP_EMPTY_DELAY:-true}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - default
      - searxng-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/worker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Next.js App
  app:
    container_name: aihaberleri-app
    hostname: aihaberleri-app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        BUILDKIT_INLINE_CACHE: 1
        DOCKER_BUILDKIT: 1
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 1G
    environment:
      DATABASE_URL: postgres://postgres:518518Erkan@aihaberleri-postgres:5432/postgresainewsdb?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
      REDIS_URL: redis://aihaberleri-redis:6379
      NEXTAUTH_URL: https://aihaberleri.org
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # AI Models
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_URL: ${NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-qwen/qwen3-next-80b-a3b-instruct}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      # Search & Scraping
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng-pwcsc8ow08oks0ggokwoo8ww.77.42.68.4.sslip.io}
      JINA_READER_API_KEY: ${JINA_READER_API_KEY}
      # Image Sources
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-info@aihaberleri.org}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@aihaberleri.org}
      # Firebase Push Notifications
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      # Site Identity
      NEXT_PUBLIC_SITE_URL: https://aihaberleri.org
      NEXT_PUBLIC_SITE_NAME: "AI Haberleri"
      NEXT_PUBLIC_SITE_DESCRIPTION: "Yapay zeka dunyasindaki gelismeleri yakindan takip edin"
      NEXT_PUBLIC_ADMIN_EMAIL: ${NEXT_PUBLIC_ADMIN_EMAIL:-admin@example.com}
      TWITTER_HANDLE: "@aihaberleriorg"
      CONTACT_EMAIL: "info@aihaberleri.org"
      # Agent Config
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_MIN_ARTICLES_PER_RUN: ${AGENT_MIN_ARTICLES_PER_RUN:-1}
      AGENT_MAX_ARTICLES_PER_RUN: ${AGENT_MAX_ARTICLES_PER_RUN:-1}
      AGENT_MIN_INTERVAL_HOURS: ${AGENT_MIN_INTERVAL_HOURS:-6}
      RUN_PRISMA_MIGRATIONS: ${RUN_PRISMA_MIGRATIONS:-false}
      # AdSense
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID}
      NEXT_PUBLIC_ADSENSE_ENABLED: ${NEXT_PUBLIC_ADSENSE_ENABLED:-true}
      # Google Analytics & AdSense (admin dashboard)
      GOOGLE_SERVICE_ACCOUNT_KEY: ${GOOGLE_SERVICE_ACCOUNT_KEY}
      GA_CLIENT_EMAIL: ${GA_CLIENT_EMAIL}
      GA_PRIVATE_KEY: ${GA_PRIVATE_KEY}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID}
      ADSENSE_CLIENT_EMAIL: ${ADSENSE_CLIENT_EMAIL}
      ADSENSE_PRIVATE_KEY: ${ADSENSE_PRIVATE_KEY}
      ADSENSE_ACCOUNT_ID: ${ADSENSE_ACCOUNT_ID}
      # Cloudflare R2 Storage
      R2_ENDPOINT: https://aeccc306d39052bd2f83982530dd11a5.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: 28a9b95872b15484627a7713c1b57998
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: aihaberleri-images
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://images.aihaberleri.org}
      # Cloudflare CDN Cache Purge
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Push Notifications
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_EMAIL:-mailto:admin@aihaberleri.org}
      # Client-side Analytics
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - default
      - searxng-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
