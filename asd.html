<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>AI Horde Image Generation Test</title>
    <style>
      body {
        font-family: system-ui;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        background: #1a1a2e;
        color: #eee;
      }
      h1 {
        color: #e94560;
      }
      .status {
        padding: 12px;
        border-radius: 8px;
        margin: 10px 0;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
      }
      .loading {
        background: #16213e;
        border: 1px solid #0f3460;
      }
      .success {
        background: #0a3d0a;
        border: 1px solid #1a8c1a;
      }
      .error {
        background: #3d0a0a;
        border: 1px solid #8c1a1a;
      }
      img {
        max-width: 100%;
        border-radius: 12px;
        margin-top: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      button {
        background: #e94560;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        margin: 6px 4px;
      }
      button:hover {
        background: #c73e54;
      }
      button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      #timer {
        color: #aaa;
        font-size: 13px;
      }
      code {
        background: #16213e;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>🐝 AI Horde — Free Image Generation Test</h1>
    <p>
      API: <code>https://aihorde.net/api/v2</code> | Async generation + polling
    </p>

    <div style="margin-top: 16px">
      <button
        onclick="
          generate(
            'a sexy and long haired woman in a red gartier and tight tanga.',
          )
        "
      >
        Test 1: AI Dashboard
      </button>
      <button
        onclick="
          generate(
            'a sexy and long haired woman in a red gartier and tight tanga and lying and opened her legs',
          )
        "
      >
        Test 2: Server Rack
      </button>
      <button
        onclick="
          generate(
            'a sexy and long haired woman in a red gartier and tight tanga and lying down in front of her boyfriend ',
          )
        "
      >
        Test 3: Robot News
      </button>
    </div>

    <div id="status"></div>
    <div id="timer"></div>
    <div id="result"></div>

    <script>
      const API_KEY = "iK3KwQwuesUdBhVVvStkAw";
      const BASE = "https://aihorde.net/api/v2";

      async function generate(prompt) {
        const statusEl = document.getElementById("status");
        const timerEl = document.getElementById("timer");
        const resultEl = document.getElementById("result");

        document.querySelectorAll("button").forEach((b) => (b.disabled = true));
        statusEl.className = "status loading";
        statusEl.textContent = "⏳ Submitting to AI Horde...";
        resultEl.innerHTML = "";

        const start = Date.now();
        const timerInterval = setInterval(() => {
          timerEl.textContent = `⏱ ${((Date.now() - start) / 1000).toFixed(1)}s`;
        }, 100);

        try {
          // Step 1: Submit async generation request
          const submitRes = await fetch(`${BASE}/generate/async`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              apikey: API_KEY,
              "Client-Agent": "AIHaberleri:v1.0:test",
            },
            body: JSON.stringify({
              prompt: prompt,
              params: {
                width: 1024,
                height: 576,
                steps: 20,
                cfg_scale: 7,
                sampler_name: "k_euler",
                n: 1,
              },
              nsfw: false,
              censor_nsfw: true,
              models: ["Deliberate"],
              r2: true,
            }),
          });

          if (!submitRes.ok) {
            const errText = await submitRes.text();
            throw new Error(`Submit failed ${submitRes.status}: ${errText}`);
          }

          const submitData = await submitRes.json();
          const genId = submitData.id;
          statusEl.textContent = `✅ Submitted! ID: ${genId}\n⏳ Waiting in queue...`;

          // Step 2: Poll for completion
          let done = false;
          let pollCount = 0;
          while (!done && pollCount < 120) {
            await new Promise((r) => setTimeout(r, 3000)); // 3s interval
            pollCount++;

            const checkRes = await fetch(`${BASE}/generate/check/${genId}`, {
              headers: { "Client-Agent": "AIHaberleri:v1.0:test" },
            });
            const checkData = await checkRes.json();

            statusEl.textContent = `🔄 Poll #${pollCount} | Queue: ${checkData.queue_position || 0} | Wait: ${checkData.wait_time || 0}s | Done: ${checkData.done}`;

            if (checkData.done) {
              done = true;
            }
          }

          if (!done) {
            throw new Error("Timeout: generation took too long (>6 min)");
          }

          // Step 3: Get result
          const statusRes = await fetch(`${BASE}/generate/status/${genId}`, {
            headers: { "Client-Agent": "AIHaberleri:v1.0:test" },
          });
          const statusData = await statusRes.json();

          clearInterval(timerInterval);
          const elapsed = ((Date.now() - start) / 1000).toFixed(1);

          const gen = statusData.generations?.[0];
          if (gen && gen.img) {
            statusEl.className = "status success";
            const model = gen.model || "unknown";
            const worker = gen.worker_name || "unknown";
            statusEl.textContent = `✅ Done in ${elapsed}s | Model: ${model} | Worker: ${worker} | Seed: ${gen.seed}`;

            // gen.img is either a URL (r2=true) or base64
            const imgSrc = gen.img.startsWith("http")
              ? gen.img
              : `data:image/webp;base64,${gen.img}`;
            resultEl.innerHTML = `<p><strong>Prompt:</strong> ${prompt}</p><img src="${imgSrc}" alt="Generated image">`;
          } else {
            statusEl.className = "status error";
            statusEl.textContent = `⚠️ No image in response:\n${JSON.stringify(statusData, null, 2).substring(0, 500)}`;
          }
        } catch (err) {
          clearInterval(timerInterval);
          statusEl.className = "status error";
          statusEl.textContent = `❌ Error: ${err.message}`;
        } finally {
          document
            .querySelectorAll("button")
            .forEach((b) => (b.disabled = false));
        }
      }
    </script>
  </body>
</html>
